name: uniswap-v2-pair-metrics

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uniswap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniswap}
      POSTGRES_DB: ${POSTGRES_DB:-uniswap_v2_pair_metrics}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniswap} -d ${POSTGRES_DB:-uniswap_v2_pair_metrics}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ingest:
    profiles: [ ingest ]
    restart: "no"
    build:
      context: .
      dockerfile: packages/ingest/Dockerfile
    environment:
      THEGRAPH_API_KEY: ${THEGRAPH_API_KEY}
      DATABASE_URL: postgres://${POSTGRES_USER:-uniswap}:${POSTGRES_PASSWORD:-uniswap}@db:5432/${POSTGRES_DB:-uniswap_v2_pair_metrics}
    depends_on:
      db:
        condition: service_healthy

  api:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-uniswap}:${POSTGRES_PASSWORD:-uniswap}@db:5432/${POSTGRES_DB:-uniswap_v2_pair_metrics}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

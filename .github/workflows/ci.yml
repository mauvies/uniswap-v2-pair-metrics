name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Same image and credentials as docker-compose.yaml, so a test meets the same database
    # here as it does locally.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uniswap
          POSTGRES_PASSWORD: uniswap
          POSTGRES_DB: uniswap_v2_pair_metrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://uniswap:uniswap@localhost:5432/uniswap_v2_pair_metrics

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

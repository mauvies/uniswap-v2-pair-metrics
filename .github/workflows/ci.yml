name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm check

      # Here from the start so no later commit can be the first to introduce a
      # type error or broken test unnoticed. Both fan out with `pnpm -r
      # --if-present`, so they exit 0 until the first package lands.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
